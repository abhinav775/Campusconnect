<!DOCTYPE html>

<body>

    <p>Browse and explore clubs that match your interests!</p>

  <nav>
    <a href="{{ url_for('student-dash') }}">BACK TO DASHBOARD</a>

      <img src="ethereal banner.jpg" alt="Banner" class="club-banner">

      <img src="thrya banner.jpg" alt="Banner" class="club-banner">

    </div>

</html>
