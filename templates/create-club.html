<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Club - Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="login-container">
    <h2>Create New Club</h2>
    <form action="{{ url_for('create_club') }}" method="post">
      <input type="text" name="name" placeholder="Club Name" required>
      <input type="text" name="banner" placeholder="Banner Image Filename" required>
      <button type="submit" class="btn">Create Club</button>
    </form>
  </div>
</body>
</html>
