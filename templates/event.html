<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='event.css') }}">
</head>
<body>

  <!-- Back to Dashboard -->
  <div style="padding: 20px;">
    <a href="{{ url_for('student_dashboard') }}" class="btn">← Back to Dashboard</a>
  </div>

  <!-- Events Header -->
  <header>
    <h1>🎉 Upcoming College Events</h1>
    <p>Join your favorite clubs and never miss an exciting event!</p>
  </header>

  <!-- Event Cards -->
  <div class="events-container">
    {% for event in events %}
    <div class="event-card">
      <h2>{{ event.name }}</h2>
      <p><strong>Date:</strong> {{ event.date }}</p>
      <p><strong>Hosted by:</strong> {{ event.host }}</p>
      <p>{{ event.description }}</p>

      <!-- ✅ Register Form -->
      <form method="post" action="{{ url_for('register_event', event_id=event.id) }}">
        <button type="submit" class="btn">Register</button>
      </form>

    </div>
    {% endfor %}
  </div>

  <!-- Footer -->
  <footer>
    © 2025 CampusConnect
  </footer>

</body>
</html>
