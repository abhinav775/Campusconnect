<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browse Our Clubs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='club.css') }}">
</head>
<body>

  <header>
    <h1>Welcome to the Club Directory</h1>
    <p>Browse and explore clubs that match your interests!</p>
  </header>

  <nav>
    <a href="{{ url_for('student_dashboard') }}">BACK TO DASHBOARD</a>
  </nav>

  <div class="container">

    <!-- Loop through clubs dynamically -->
    {% for club in clubs %}
      <div class="club-card">
        <!-- Club banner image -->
        <img src="{{ url_for('static', filename=club['banner']) }}" alt="Banner" class="club-banner">
        
        <!-- Club name -->
        <h3>{{ club['name'] }}</h3>
        
        <!-- Join button -->
        <form method="post" action="{{ url_for('join_club', club_id=club['id']) }}">
          <button type="submit" class="join-btn">Join</button>
        </form>
      </div>
    {% endfor %}

  </div>

</body>
</html>
