<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event - Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="login-container">
    <h2>Create New Event</h2>
    <form action="{{ url_for('create_event') }}" method="post">
      <input type="text" name="name" placeholder="Event Name" required />
      <input type="date" name="date" placeholder="Event Date" required />
      <input type="text" name="host" placeholder="Host/Club Name" required />
      <textarea name="description" placeholder="Event Description" rows="4" required></textarea>
      <button type="submit" class="btn">Create Event</button>
    </form>
    <p class="register-link">
      <a href="{{ url_for('admin_dashboard') }}">← Back to Dashboard</a>
    </p>
  </div>
</body>
</html>
