<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - CampusConnect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='student-dash.css') }}">
</head>
<body>
  <div class="dashboard-container">
    <h1>Welcome, Student!</h1>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <a href="{{ url_for('browse_clubs') }}" class="btn">Browse Clubs</a>
      <a href="{{ url_for('browse_events') }}" class="btn">Browse Events</a>
    </div>

    <!-- Recent Activities -->
    <h2>Recent Activities</h2>
    <div class="recent-activities">
      {% for event in events %}
      <div class="activity-card">
        <h3>{{ event.name }}</h3>
        <p>Organized by {{ event.host }}</p>
        <span>{{ event.date }}</span><br>
        <span>Time: {{ event.time }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
