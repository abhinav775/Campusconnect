<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Registration - CampusConnect</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <h2>Admin Registration</h2>
    <form action="register-success.html" method="post">
      <input type="text" name="adminName" placeholder="Admin Name" required />
      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="tel" name="phone" placeholder="Phone Number" required pattern="[0-9]{10}" />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn">Register</button>
    </form>
    <p class="register-link">
      Already have an account? <a href="admin-login.html">Login here</a>
    </p>
 </div>
</body>
</html>
